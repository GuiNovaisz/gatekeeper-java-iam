name: gatekeeper
services:
  postgres:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/configure.ps1 or scripts/configure.sh}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper -d gatekeeper"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 384m
  gatekeeper:
    build: .
    image: gatekeeper:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/gatekeeper
      DATABASE_USER: gatekeeper
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Required}
      SIGNING_KEYSTORE: /run/secrets/signing.p12
      SIGNING_KEYSTORE_PASSWORD: ${SIGNING_KEYSTORE_PASSWORD:?Required}
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:?Required}
      BOOTSTRAP_LOGIN: ${BOOTSTRAP_LOGIN:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      COOKIE_SECURE: "false"
      ISSUER: http://127.0.0.1:8080
    volumes:
      - ./secrets/signing.p12:/run/secrets/signing.p12:ro
    ports:
      - "127.0.0.1:${GATEKEEPER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres-data:
