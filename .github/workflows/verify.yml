name: verify
on:
  push:
    branches: [feature/iam-foundation, dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_API_VERSION: '1.44'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, unit, PostgreSQL integration, protocol and adversarial tests, package
        run: sh mvnw -B -ntp clean verify
      - name: Audit resolved dependencies including test transitives
        run: |
          sh mvnw -B -ntp dependency:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
          python3 scripts/audit-dependencies.py
      - name: Generate masked ephemeral configuration
        run: sh scripts/configure.sh
      - name: Docker build and Compose clean-start
        run: docker compose up --build --wait --wait-timeout 180
      - name: Health, discovery and deny-default smoke
        run: |
          curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness > /dev/null
          curl --fail --silent http://127.0.0.1:8080/.well-known/openid-configuration > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/audit)" = 401
      - name: Collect safe evidence
        if: always()
        run: |
          mkdir -p target/evidence
          docker compose logs --no-color > target/evidence/compose.log 2>&1 || true
          python3 scripts/scan-artifacts.py
      - name: Upload verified reports
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-verification
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/evidence/
          retention-days: 7
      - name: Cleanup task-owned containers and temporary credentials
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env secrets/signing.p12
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
